[project]
name = "claude-reader"
version = "0.1.0"
description = "A live reading pane for Claude Code sessions: only the text Claude writes to you, in any terminal"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Vikas", email = "vikasg.rac@gmail.com" }]
keywords = ["claude", "claude-code", "tui", "terminal", "textual"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = ["textual>=0.80"]

[project.urls]
Homepage = "https://github.com/vikasgrac/claude-reader"
Issues = "https://github.com/vikasgrac/claude-reader/issues"

[project.scripts]
claude-reader = "claude_reader:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["claude_reader"]
